[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Tell Netlify's secret scanner to ignore the public Supabase URL, which must be compiled into NextJS chunks.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL"

# The official Next.js runtime configuration for Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"
